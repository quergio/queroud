<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>coming soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #030303;
      --text: #ffffff;
      --muted: #8d8d98;

      --pink: #ff2fb9;
      --purple: #7c5cff;
      --blue: #4cc9ff;
      --card: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      font-family: "Inter", sans-serif;
      color: var(--text);

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at 20% 20%,
          rgba(255, 47, 185, 0.22),
          transparent 22%),

        radial-gradient(circle at 80% 0%,
          rgba(76, 201, 255, 0.18),
          transparent 25%),

        radial-gradient(circle at 50% 100%,
          rgba(124, 92, 255, 0.22),
          transparent 28%),

        #030303;

      position: relative;
    }

    /* grid */

    body::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg,
          rgba(255, 255, 255, 0.03) 1px,
          transparent 1px);

      background-size: 42px 42px;

      mask-image:
        radial-gradient(circle at center,
          black 35%,
          transparent 95%);

      pointer-events: none;
    }

    /* floating glow orbs */

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.22;
      animation: float 12s ease-in-out infinite;
    }

    .orb.one {
      width: 450px;
      height: 450px;
      background: var(--pink);
      top: -120px;
      left: -120px;
    }

    .orb.two {
      width: 500px;
      height: 500px;
      background: var(--purple);
      bottom: -180px;
      right: -120px;
      animation-delay: -4s;
    }

    .orb.three {
      width: 350px;
      height: 350px;
      background: var(--blue);
      top: 50%;
      left: 60%;
      animation-delay: -8s;
    }

    .container {
      position: relative;
      z-index: 5;

      width: 92%;
      max-width: 980px;

      border-radius: 40px;
      overflow: hidden;

      background:
        linear-gradient(to bottom right,
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.03));

      border: 1px solid rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(35px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

      animation: fadeUp 1s cubic-bezier(.2, .8, .2, 1);
    }

    /* shiny top line */

    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 1px;

      background:
        linear-gradient(to right,
          transparent,
          rgba(255, 255, 255, 0.6),
          transparent);
    }

    .hero {
      padding: 90px 70px 70px;
      text-align: center;
      position: relative;
    }

    .tiny {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding: 12px 22px;
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);

      font-size: 0.9rem;
      color: #d8d8de;

      margin-bottom: 35px;

      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .emoji {
      font-size: 6rem;
      margin-bottom: 28px;

      filter:
        drop-shadow(0 0 30px rgba(255, 47, 185, 0.25));
    }

    h1 {
      font-size: clamp(4.5rem, 12vw, 8rem);
      line-height: 0.9;

      font-weight: 900;
      letter-spacing: -6px;

      margin-bottom: 28px;

      background:
        linear-gradient(to bottom,
          #ffffff 10%,
          #d8d8d8 55%,
          #6f6f6f 100%);

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow:
        0 0 30px rgba(255, 255, 255, 0.05);
    }

    .subtitle {
      max-width: 680px;
      margin: auto;

      color: #d0d0d5;
      font-size: 1.2rem;
      line-height: 1.9;
    }

    /* bottom glass panel */

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;

      padding: 30px 40px;

      background:
        linear-gradient(to right,
          rgba(255, 255, 255, 0.04),
          rgba(255, 255, 255, 0.02));

      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 14px;

      color: #b7b7c0;
      font-size: 0.95rem;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;

      background: #00ff88;

      box-shadow:
        0 0 14px #00ff88,
        0 0 25px #00ff88;

      animation: pulse 2s infinite;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 12px;

      text-decoration: none;
      color: white;

      padding: 16px 24px;
      border-radius: 18px;

      font-weight: 600;

      background:
        linear-gradient(135deg,
          rgba(255, 47, 185, 0.18),
          rgba(124, 92, 255, 0.18));

      border: 1px solid rgba(255, 255, 255, 0.08);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    }

    .button:hover {
      transform: translateY(-4px);

      border-color:
        rgba(255, 255, 255, 0.16);

      box-shadow:
        0 15px 35px rgba(255, 47, 185, 0.18);
    }

    .shine {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(120deg,
          transparent 20%,
          rgba(255, 255, 255, 0.08) 40%,
          transparent 60%);

      transform: translateX(-120%);
      animation: shine 7s linear infinite;

      pointer-events: none;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(35px);
      }
    }

    @keyframes shine {
      to {
        transform: translateX(120%);
      }
    }

    @media (max-width: 850px) {

      .hero {
        padding: 70px 28px 50px;
      }

      .bottom {
        flex-direction: column;
        text-align: center;
      }

      h1 {
        letter-spacing: -3px;
      }

      .subtitle {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>

  <div class="container">

    <div class="shine"></div>

    <section class="hero">

      <div class="tiny">
        ⚡ under construction
      </div>

      <div class="emoji">
        🚧
      </div>

      <h1>
        coming<br>soon
      </h1>

      <p class="subtitle">
        this project is currently being built,
        redesigned, rewritten, accidentally destroyed,
        and rebuilt again at 3am.
      </p>

    </section>

    <section class="bottom">

      <div class="status">
        <div class="dot"></div>
        development in progress
      </div>

      <a href="../index.html" class="button">
        ← back to homepage
      </a>

    </section>

  </div>

</body>

</html>
