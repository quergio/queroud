
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>the button clicker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #020202;
      --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.08);
      --text: white;
      --muted: #8d8d98;
      --pink: #ff2fb9;
      --purple: #7c5cff;
      --blue: #47c7ff;
      --green: #2cff88;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at top left,
          rgba(255,47,185,0.16),
          transparent 22%),

        radial-gradient(circle at top right,
          rgba(71,199,255,0.16),
          transparent 22%),

        radial-gradient(circle at bottom,
          rgba(124,92,255,0.18),
          transparent 35%),

        var(--bg);

      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

      background-size: 42px 42px;

      mask-image:
        radial-gradient(circle at center,
          black 35%,
          transparent 95%);

      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.18;
      z-index: 0;
      animation: float 15s ease-in-out infinite;
    }

    .orb.one {
      width: 500px;
      height: 500px;
      background: var(--pink);
      top: -200px;
      left: -150px;
    }

    .orb.two {
      width: 600px;
      height: 600px;
      background: var(--purple);
      bottom: -250px;
      right: -200px;
      animation-delay: -5s;
    }

    .orb.three {
      width: 350px;
      height: 350px;
      background: var(--blue);
      top: 45%;
      left: 65%;
      animation-delay: -9s;
    }

    .container {
      max-width: 1500px;
      margin: auto;
      padding: 30px;
      position: relative;
      z-index: 2;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;

      margin-bottom: 30px;

      padding: 18px 22px;
      border-radius: 24px;

      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(25px);
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .home-btn {
      padding: 12px 18px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: white;
      text-decoration: none;
      transition: 0.25s ease;
    }

    .home-btn:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,0.08);
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: clamp(4rem, 10vw, 8rem);
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -6px;

      background:
        linear-gradient(to bottom,
          #ffffff,
          #bbbbbb,
          #666666);

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      margin-bottom: 20px;
    }

    .subtitle {
      color: #d0d0d5;
      font-size: 1.1rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr 0.9fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      background:
        linear-gradient(to bottom right,
          rgba(255,255,255,0.07),
          rgba(255,255,255,0.03));

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 32px;
      padding: 28px;

      backdrop-filter: blur(30px);

      box-shadow:
        0 25px 60px rgba(0,0,0,0.4);
    }

    .panel-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .nickname-box {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: white;
      font-family: inherit;
      outline: none;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .save-btn {
      padding: 14px 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: white;
      font-weight: 700;
    }

    .click-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      min-height: 600px;
    }

    .score {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: -3px;
    }

    .cps {
      color: var(--muted);
      font-size: 1rem;
    }

    .big-button {
      width: 260px;
      height: 260px;
      border-radius: 50%;

      background:
        radial-gradient(circle at top,
          #ff86d8,
          #ff2fb9 45%,
          #b5007a 100%);

      border: 8px solid rgba(255,255,255,0.12);

      color: white;
      font-size: 2rem;
      font-weight: 900;

      box-shadow:
        0 20px 60px rgba(255,47,185,0.45),
        inset 0 -18px 30px rgba(0,0,0,0.3),
        inset 0 8px 20px rgba(255,255,255,0.3);

      transition:
        transform 0.08s ease,
        box-shadow 0.2s ease;
    }

    .big-button:hover {
      transform: scale(1.03);
    }

    .big-button:active {
      transform: scale(0.96);
    }

    .upgrades {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 850px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .upgrade {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      padding: 20px;
      transition: 0.25s ease;
    }

    .upgrade:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,0.06);
    }

    .upgrade-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .upgrade-name {
      font-weight: 800;
      font-size: 1.05rem;
    }

    .upgrade-desc {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .buy-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .buy-btn:hover {
      background: linear-gradient(135deg, var(--blue), var(--purple));
    }

    .leaderboard {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .leader {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 14px 16px;
      border-radius: 18px;

      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .admin-panel {
      margin-top: 24px;
      padding: 20px;
      border-radius: 24px;
      background:
        linear-gradient(135deg,
          rgba(255,47,185,0.16),
          rgba(124,92,255,0.16));

      border: 1px solid rgba(255,255,255,0.08);

      display: none;
    }

    .admin-buttons {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .admin-buttons button {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-weight: 700;
    }

    @keyframes float {
      0%,100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(40px);
      }
    }

    @media (max-width: 1200px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="orb one"></div>
<div class="orb two"></div>
<div class="orb three"></div>

<div class="container">

  <div class="topbar">
    <div class="logo">the button clicker</div>

    <a class="home-btn" href="../index.html">
      ← back to homepage
    </a>
  </div>

  <section class="hero">
    <h1>
      CLICK<br>THE BUTTON
    </h1>

    <p class="subtitle">
      click button. get rich. destroy reality.
    </p>
  </section>

  <div class="layout">

    <div class="panel click-zone">

      <div class="nickname-box">
        <input id="nickname" maxlength="16" placeholder="enter nickname">
        <button class="save-btn" onclick="saveNickname()">
          save
        </button>
      </div>

      <div class="score" id="score">
        0
      </div>

      <div class="cps" id="cps">
        0 clicks per second
      </div>

      <button class="big-button" onclick="clickButton()">
        THE BUTTON
      </button>

      <div class="cps">
        username: <span id="currentUser">guest</span>
      </div>

    </div>

    <div class="panel">
      <div class="panel-title">
        ⚡ upgrades
      </div>

      <div class="upgrades" id="upgrades"></div>
    </div>

    <div class="panel">
      <div class="panel-title">
        🏆 leaderboard
      </div>

      <div class="leaderboard" id="leaderboard"></div>

      <div class="admin-panel" id="adminPanel">
        <div class="panel-title">
          👑 admin panel
        </div>

        <div style="color:#d7d7df; line-height:1.7;">
          welcome back travis.
        </div>

        <div class="admin-buttons">
          <button onclick="addClicks(100000)">
            +100k clicks
          </button>

          <button onclick="unlockEverything()">
            unlock all
          </button>

          <button onclick="wipeLeaderboard()">
            wipe leaderboard
          </button>

          <button onclick="rainbowMode()">
            rainbow mode
          </button>

          <button onclick="spawnChaos()">
            chaos mode
          </button>

          <button onclick="resetGame()">
            reset game
          </button>
        </div>
      </div>

    </div>

  </div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
 setDoc,
  getDocs,
  getDoc,
  collection
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyBivV6Stj3RcTU2pZUBt6c-5WHSdujw7FE",

  authDomain: "queroad-b9a31.firebaseapp.com",

  projectId: "queroad-b9a31",

  storageBucket: "queroad-b9a31.appspot.com",

  messagingSenderId: "1016489850255",

  appId: "1:1016489850255:web:72933dbb9c8afb466947fa"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.db = db;
window.setDoc = setDoc;
window.doc = doc;
window.getDocs = getDocs;
window.collection = collection;
window.getDoc = getDoc;

</script>

<script>

let score = Number(localStorage.getItem("score")) || 0;
let cps = 0;
let username = localStorage.getItem("username") || "guest";

const scoreEl = document.getElementById("score");
const cpsEl = document.getElementById("cps");
const leaderboardEl = document.getElementById("leaderboard");
const currentUser = document.getElementById("currentUser");
const adminPanel = document.getElementById("adminPanel");

currentUser.textContent = username;

if(username.toLowerCase() === "travis") {
  adminPanel.style.display = "block";
}

const upgrades = [
  {name:"rusty finger", cost:10, power:1, desc:"click slightly harder"},
  {name:"gaming mouse", cost:50, power:3, desc:"rgb increases power"},
  {name:"monster energy", cost:100, power:6, desc:"you feel unstoppable"},
  {name:"auto clicker", cost:250, cps:1, desc:"the beginning of automation"},
  {name:"school chromebook", cost:500, cps:2, desc:"barely functioning"},
  {name:"button factory", cost:1000, cps:5, desc:"mass production"},
  {name:"nuclear finger", cost:2500, power:25, desc:"extremely unsafe"},
  {name:"quantum clicking", cost:5000, cps:20, desc:"physics breaking"},
  {name:"ai click farm", cost:10000, cps:50, desc:"robots crave button"},
  {name:"reality engine", cost:25000, cps:100, desc:"button controls existence"},
  {name:"dark matter tapper", cost:50000, cps:200, desc:"nobody understands it"},
  {name:"forbidden technology", cost:100000, cps:500, desc:"government watching"},
  {name:"infinite generator", cost:250000, cps:1200, desc:"it never stops"},
  {name:"multiverse machine", cost:500000, cps:3000, desc:"alternate dimensions clicking"},
  {name:"the singularity", cost:1000000, cps:10000, desc:"humanity has lost"},
  {name:"god finger", cost:5000000, power:10000, desc:"reality bends"},
  {name:"universe printer", cost:10000000, cps:25000, desc:"creates buttons from nothing"},
  {name:"hyperclick reactor", cost:50000000, cps:100000, desc:"nobody can stop it"},
  {name:"button apocalypse", cost:100000000, cps:500000, desc:"the final stage"},
  {name:"THE CORE", cost:1000000000, cps:5000000, desc:"you should not have reached this"}
];

let clickPower = 1;

function updateUI() {
  scoreEl.textContent = format(score);
  cpsEl.textContent = format(cps) + " clicks per second";

  localStorage.setItem("score", score);

  updateLeaderboard();
}

function clickButton() {
  score += clickPower;

  document.querySelector(".big-button").style.transform = "scale(0.94)";

  setTimeout(() => {
    document.querySelector(".big-button").style.transform = "scale(1)";
  }, 70);

  if(Math.random() < 0.05) {
    randomChaos();
  }

  updateUI();
}

function randomChaos() {

  const effects = [

    () => {
      document.body.style.filter = "hue-rotate(" + Math.random() * 360 + "deg)";
    },

    () => {
      document.body.style.transform = "rotate(1deg)";
      setTimeout(() => {
        document.body.style.transform = "rotate(0deg)";
      }, 150);
    },

    () => {
      document.querySelector(".big-button").innerText = "DO NOT PRESS";
    },

    () => {
      document.querySelector(".big-button").style.boxShadow =
        "0 0 120px #ff00ff";
    },

    () => {
      document.title = "THE BUTTON IS WATCHING";
    },

    () => {
      score += 1000;
    },

    () => {
      document.body.style.zoom = "1.03";
      setTimeout(() => {
        document.body.style.zoom = "1";
      }, 300);
    }
  ];

  effects[Math.floor(Math.random() * effects.length)]();
}

function createUpgrades() {

  const upgradesEl = document.getElementById("upgrades");

  upgradesEl.innerHTML = "";

  upgrades.forEach(upgrade => {

    const div = document.createElement("div");
    div.className = "upgrade";

    div.innerHTML = `
      <div class="upgrade-top">
        <div class="upgrade-name">
          ${upgrade.name}
        </div>

        <div>
          ${format(upgrade.cost)}
        </div>
      </div>

      <div class="upgrade-desc">
        ${upgrade.desc}
      </div>

      <button class="buy-btn">
        buy upgrade
      </button>
    `;

    div.querySelector("button").onclick = () => {

      if(score >= upgrade.cost) {

        score -= upgrade.cost;

        if(upgrade.power) {
          clickPower += upgrade.power;
        }

        if(upgrade.cps) {
          cps += upgrade.cps;
        }

        upgrade.cost = Math.floor(upgrade.cost * 1.6);

        createUpgrades();
        updateUI();
      }
    };

    upgradesEl.appendChild(div);
  });
}

async function saveNickname() {

  // already locked username
  if(localStorage.getItem("usernameLocked")) {
    alert("username already locked");
    return;
  }

  const input = document.getElementById("nickname");

  if(!input.value) return;

  let chosen = input.value.trim().toLowerCase();

  // banned names
  if(chosen.length < 3) {
    alert("name too short");
    return;
  }

  // get used names
  let usedNames =
    JSON.parse(localStorage.getItem("usedNames")) || [];

  // check if already taken
  if(usedNames.includes(chosen)) {
    alert("username already taken");
    return;
  }

  const existingUser = await getDoc(
  doc(db, "leaderboard", chosen)
);

if(existingUser.exists()) {
  alert("username already taken");
  return;
}
  // save username
  username = chosen;

  localStorage.setItem("username", username);

  // LOCK IT FOREVER
  localStorage.setItem("usernameLocked", "true");

  // add to taken names
  usedNames.push(chosen);

  localStorage.setItem(
    "usedNames",
    JSON.stringify(usedNames)
  );

  currentUser.textContent = username;

  // disable input after set
  input.disabled = true;

  // hide button
  document.querySelector(".save-btn").disabled = true;

  if(username === "travis") {
    adminPanel.style.display = "block";
  }

  updateLeaderboard();
}

async function updateLeaderboard() {

  if(username === "guest") return;

  // SAVE PLAYER TO FIREBASE
  await setDoc(
    doc(db, "leaderboard", username),
    {
      name: username,
      score: Math.floor(score)
    }
  );

  // GET EVERY PLAYER
  const snapshot = await getDocs(
    collection(db, "leaderboard")
  );

  let board = [];

  snapshot.forEach(docSnap => {
    board.push(docSnap.data());
  });

  // SORT
  board.sort((a, b) => b.score - a.score);

  // TOP 10
  board = board.slice(0, 10);

  // RENDER
  leaderboardEl.innerHTML = "";

  board.forEach((player, i) => {

    const div = document.createElement("div");

    div.className = "leader";

    div.innerHTML = `
      <div>
        #${i + 1} • ${player.name}
      </div>

      <div>
        ${format(player.score)}
      </div>
    `;

    leaderboardEl.appendChild(div);
  });
}

  board.sort((a,b) => b.score - a.score);

  board = board.slice(0, 10);

  localStorage.setItem("leaderboard", JSON.stringify(board));

  leaderboardEl.innerHTML = "";

  board.forEach((player, i) => {

    const div = document.createElement("div");

    div.className = "leader";

    div.innerHTML = `
      <div>
        #${i+1} • ${player.name}
      </div>

      <div>
        ${format(player.score)}
      </div>
    `;

    leaderboardEl.appendChild(div);
  });
}

function addClicks(amount) {
  score += amount;
  updateUI();
}

function unlockEverything() {

  upgrades.forEach(u => {
    if(u.cps) cps += u.cps;
    if(u.power) clickPower += u.power;
  });

  updateUI();
}

function wipeLeaderboard() {

  localStorage.removeItem("leaderboard");

  updateLeaderboard();
}

function rainbowMode() {

  setInterval(() => {

    document.body.style.filter =
      "hue-rotate(" + Math.random() * 360 + "deg)";

  }, 100);
}

function spawnChaos() {

  setInterval(() => {

    randomChaos();

  }, 300);
}

function resetGame() {

  localStorage.clear();

  location.reload();
}

function format(num) {

  if(num >= 1e12) return (num/1e12).toFixed(1) + "T";
  if(num >= 1e9) return (num/1e9).toFixed(1) + "B";
  if(num >= 1e6) return (num/1e6).toFixed(1) + "M";
  if(num >= 1e3) return (num/1e3).toFixed(1) + "K";

  return Math.floor(num);
}

setInterval(() => {

  score += cps / 10;

  updateUI();

}, 100);

createUpgrades();
updateUI();

</script>

</body>
</html>
